<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo!</title>
</head>

<body>
    <div class="formularios">
        <form autocomplete="off" id="formLogin">
            <div class="titulo">
                <h2>Iniciar Sessão</h2>
                <p>Bem-vindo! Insira seu e-mail e senha para prosseguir</p>
            </div>
            <div class="inputs">
                <div class="divInput">
                    <div class="icon">
                        <img src="../assets/Site assets/gmailIcon.png" alt="icon">
                    </div>
                    <input type="email" id="emailClient" placeholder="Endereço de E-mail" required>
                </div>

                <div class="divInput">
                    <div class="icon">
                        <img src="../assets/Site assets/senhaOcultada.png" alt="icon">
                    </div>
                    <input type="password" id="senhaClient" placeholder="********" required>
                </div>
            </div>

            <div class="botoes">
                <button id="btnContinuar">Continuar</button>
                <div class="linha">
                    <div class="HR"><hr></div>
                    <p>ou</p>
                    <div class="HR"><hr></div>
                </div>
                <button id="entrarGoogle"> <img src="../assets/Site assets/google.png" alt="Google">Continuar com Google</button>
            </div>
              
            <p id="mensagemLogin"></p>
        </form>
    </div>

    <div class="Imagem">
        <img src="../assets/Site assets/imagemTelaLogin.png" alt="vidracaria">
    </div>
</body>

</html>
